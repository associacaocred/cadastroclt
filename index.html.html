<title>Cadastro CLT para análise de crédito</title>

<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  fontFamily: { sans: ['"Atkinson Hyperlegible"', 'system-ui', 'Segoe UI', 'Arial', 'sans-serif'] },
  colors: { ink:'#16252b', muted:'#4d5b64', page:'#edf1f7', rail:'#e0e8f3', brand:{ DEFAULT:'#0a4590', dark:'#073370' }, ok:{ DEFAULT:'#2f7a1c', dark:'#256016' }, err:'#b3261e' }
} } };
</script>
<style type="text/tailwindcss">
  @layer base {
    body { @apply font-sans text-ink bg-page text-[18px] leading-relaxed antialiased; }
    ::selection { background:#bcd3ee; color:#08254d; }
    input { caret-color:#0a4590; accent-color:#0a4590; }
    * { scrollbar-color:#9fb2cc transparent; }
    :focus-visible { outline:3px solid #0a4590; outline-offset:2px; }
    h1,h2 { text-wrap:balance; }
  }
  @layer components {
    .ic { width:1.25em; height:1.25em; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; flex:none; }
    .lbl { @apply block font-bold mb-1.5; }
    .field { @apply w-full rounded-lg border border-slate-400 bg-white px-4 py-3 text-[18px] tabular-nums transition-colors duration-150 hover:border-slate-600 focus:border-brand focus:outline-none focus:ring-4 focus:ring-brand/20; }
    .field[aria-invalid=true] { @apply border-err bg-red-50; }
    .hint { @apply mt-1.5 text-[15px] text-muted; }
    .err { @apply mt-1.5 text-[15px] font-bold text-err hidden; }
    .err.show { @apply flex gap-1.5 items-start; }
    .btn { @apply inline-flex items-center justify-center gap-2 rounded-lg px-6 py-3.5 font-bold transition duration-150 hover:-translate-y-0.5 active:translate-y-0 active:scale-[.98] disabled:opacity-60 disabled:pointer-events-none; }
    .btn-p { @apply bg-brand text-white hover:bg-brand-dark; }
    .btn-s { @apply border border-slate-400 bg-white text-ink hover:bg-slate-50; }
    .btn-go { @apply bg-ok text-white hover:bg-ok-dark; }
    .opt input { @apply sr-only; }
    .opt span { @apply flex items-center justify-center rounded-lg border border-slate-400 bg-white px-4 py-3.5 font-bold cursor-pointer transition duration-150 hover:border-brand hover:-translate-y-0.5; }
    .opt input:checked + span { @apply border-brand bg-brand text-white; }
    .opt input:focus-visible + span, input.sr-only:focus-visible + label { outline:3px solid #0a4590; outline-offset:2px; }
    .f[data-bad] .opt span { @apply border-err; }
    .step { display:none; }
    .step.on { display:block; }
    @keyframes draw { to { stroke-dashoffset:0; } }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    .done-ic circle, .done-ic path { stroke-dasharray:70; stroke-dashoffset:70; animation:draw .7s cubic-bezier(.16,1,.3,1) .15s forwards; }
    .done-box { animation:rise .45s cubic-bezier(.16,1,.3,1); }
    @media (prefers-reduced-motion: reduce) {
      * { transition:none !important; animation:none !important; }
      .done-ic circle, .done-ic path { stroke-dashoffset:0; }
    }
  }
</style>
</head>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const ic = (n, c = '') => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= CONTEÚDO (edite aqui) ================= */
  const instaNote = `<p class="mt-2 text-[15px]"><b>Deixe o perfil público</b> durante a análise. No app: Perfil › Menu › Configurações › Privacidade da conta › desligue “Conta privada”.</p>`;
  const contact = i => ({ group: `Contato ${i} de 3`, fields: [
    { n: `c${i}_nome`, l: `Nome do contato ${i}`, ph: 'Ex: Ana Souza', auto: 'off' },
    { n: `c${i}_parentesco`, l: `Grau de parentesco do contato ${i}`, ph: 'Ex: Mãe' },
    { n: `c${i}_telefone`, l: `Número do contato ${i}`, type: 'phone', im: 'tel', max: 15, ph: '(85) 99999-9999' }
  ] });

  const STEPS = [
    { title: 'Dados pessoais', icon: 'user', intro: 'Preencha como está no seu documento.', fields: [
      { n: 'nome', l: 'Nome completo', h: 'Escreva o nome inteiro, sem abreviar.', ph: 'Maria da Silva Santos', auto: 'name' },

    { title: 'Moradia e garantia', icon: 'home', intro: 'Toque na opção que combina com você.', fields: [

  ];

  /* ================= RENDER ================= */
  const tail = f => `${f.h ? `<p class="hint" id="h-${f.n}">${f.h}</p>` : ''}${f.note || ''}<p class="err" id="e-${f.n}" aria-live="polite"></p>`;

  function field(f) {
    const meta = `data-label="${esc(f.l)}" ${f.req === false ? '' : 'data-req="1"'}`;
    if (f.kind === 'choice') {
      return `<fieldset class="f" data-kind="choice" ${meta} ${f.must ? `data-must="${f.must}"` : ''}>
        <legend class="lbl">${f.l}</legend>
        <div class="grid grid-cols-2 gap-3">${f.opts.map(o => `<label class="opt"><input type="radio" name="${f.n}" value="${o}"><span>${o}</span></label>`).join('')}</div>${tail(f)}</fieldset>`;
    }
    const input = `<input id="${f.n}" name="${f.n}" class="field ${f.pre ? 'rounded-l-none' : ''}" ${f.type === 'email' ? 'type="email"' : ''} ${f.type ? `data-type="${f.type}"` : ''}
      ${f.im ? `inputmode="${f.im}"` : ''} ${f.max ? `maxlength="${f.max}"` : ''} autocomplete="${f.auto && f.auto !== 'off' ? f.auto : 'off'}" ${f.type === 'insta' ? 'autocapitalize="none"' : ''}
      placeholder="${esc(f.ph || '')}" aria-describedby="${f.h ? `h-${f.n} ` : ''}e-${f.n}">`;
    return `<div class="f" data-kind="text" ${meta}>
      <label class="lbl" for="${f.n}">${f.l}${f.req === false ? ' <span class="font-normal text-muted">(opcional)</span>' : ''}</label>
      ${f.pre ? `<div class="flex"><span class="flex items-center px-4 rounded-l-lg border border-r-0 border-slate-400 bg-rail font-bold text-brand" aria-hidden="true">${f.pre}</span>${input}</div>` : input}${tail(f)}</div>`;
  }

  const MODES = {
    cam:  { t: 'Tirar foto agora',     i: 'camera', a: 'image/*' },
    gal:  { t: 'Escolher da galeria',  i: 'image',  a: 'image/*' },
    pdf:  { t: 'Anexar PDF',           i: 'file',   a: 'application/pdf' },
    vid:  { t: 'Gravar vídeo agora',   i: 'video',  a: 'video/*' },
    galv: { t: 'Escolher da galeria',  i: 'image',  a: 'image/*,video/*' }
  };

  function upload(x) {
    const btns = x.modes.map((k, j) => {
      const m = MODES[k], cap = (k === 'cam' || k === 'vid') ? `capture="${x.face || 'environment'}"` : '';
      return `<button type="button" class="btn ${j ? 'btn-s' : 'btn-p'} !py-2.5 !px-4 w-full sm:w-auto" data-pick="${x.n}" data-mode="${k}">${ic(m.i)}${m.t}</button>
        <input type="file" hidden data-item="${x.n}" data-mode="${k}" accept="${m.a}" ${cap} ${x.m ? 'multiple' : ''}>`;
    }).join('');
    return `<div class="f flex gap-4 py-5 first:pt-0 border-b border-slate-200 last:border-0" data-kind="file" data-name="${x.n}" data-label="${esc(x.l)}" data-req="1">
      <span class="mt-0.5 text-brand">${ic(x.i)}</span>
      <div class="min-w-0 flex-1">
        <p class="font-bold">${x.l}</p>
        <p class="hint !mt-0.5" id="h-${x.n}">${x.h}</p>
        <p class="mt-3 mb-2 text-[15px] font-bold">Como você quer enviar?</p>
        <div class="flex flex-col sm:flex-row sm:flex-wrap gap-2">${btns}</div>
        <div class="pv mt-3 flex flex-col gap-2"></div>
        <p class="err" id="e-${x.n}" aria-live="polite"></p>
      </div></div>`;
  }

  $('#steps').innerHTML = STEPS.map((s, i) => `
    <section class="step" data-i="${i}" aria-labelledby="t${i}">
      <h2 id="t${i}" tabindex="-1" class="flex items-center gap-3 text-2xl font-bold text-brand outline-none"><span>${ic(s.icon)}</span>${s.title}</h2>
      <p class="mt-2 mb-6 text-muted max-w-[65ch]">${s.intro}</p>
      ${s.warn ? `<div class="mb-6 flex gap-3 rounded-lg border border-amber-700 bg-amber-50 p-4 font-bold text-amber-950">${ic('alert', 'mt-0.5')}<p>${s.warn}</p></div>` : ''}
      ${s.fields ? `<div class="space-y-6">${s.fields.map(field).join('')}</div>` : ''}
      ${s.groups ? s.groups.map((g, k) => `<div class="${k ? 'mt-8 pt-8 border-t border-slate-200' : ''}"><h3 class="font-bold text-lg mb-4">${g.group}</h3><div class="space-y-6">${g.fields.map(field).join('')}</div></div>`).join('') : ''}
      ${s.uploads ? `<div>${s.uploads.map(upload).join('')}</div>` : ''}
    </section>`).join('');

  /* ================= MÁSCARAS ================= */
  const mask = {
    cpf: v => v.replace(/\D/g, '').slice(0, 11).replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2'),
    phone: v => { v = v.replace(/\D/g, '').slice(0, 11); return v.length > 10 ? v.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3') : v.length > 6 ? v.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3') : v.length > 2 ? v.replace(/(\d{2})(\d+)/, '($1) $2') : v.replace(/^(\d+)/, '($1'); },
    insta: v => v.replace(/^@+/, '').replace(/\s/g, '')
  };
  const validCPF = c => {
    c = c.replace(/\D/g, '');
    if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false;
    for (let t = 9; t < 11; t++) { let s = 0; for (let i = 0; i < t; i++) s += c[i] * (t + 1 - i); if (((s * 10) % 11) % 10 != c[t]) return false; }
    return true;
  };

  /* ================= VALIDAÇÃO ================= */
  function problem(f) {
    const k = f.dataset.kind, L = f.dataset.label;
    if (k === 'choice') {
      const c = $('input:checked', f);
      if (!c) return `Escolha uma opção em “${L}”.`;
      if (f.dataset.must && c.value !== f.dataset.must) return `Para enviar, escolha “${f.dataset.must}” em “${L}”.`;
      return '';
    }
    if (k === 'file') return store[f.dataset.name].length ? '' : `Falta anexar: ${L}. Toque em “Escolher arquivo”.`;
    const i = $('input', f), v = i.value.trim(), t = i.dataset.type;
    if (!v) return f.dataset.req ? `Falta preencher: ${L}.` : '';
    if (t === 'cpf' && !validCPF(v)) return 'Esse CPF não confere. Confira os 11 números.';
    if (t === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return 'Esse e-mail está incompleto. Exemplo: nome@email.com';
    if (t === 'phone' && v.replace(/\D/g, '').length < 10) return 'Falta o DDD ou algum número. Exemplo: (85) 99999-9999';
    if (t === 'insta' && !/^[A-Za-z0-9._]{1,30}$/.test(v)) return 'Use só letras, números, ponto ou sublinhado, sem espaços.';
    return '';
  }
  function mark(f, msg) {
    const e = $('.err', f);
    e.innerHTML = msg ? ic('alert', '!mt-0.5') + `<span>${esc(msg)}</span>` : '';
    e.classList.toggle('show', !!msg);
    if (msg) f.setAttribute('data-bad', ''); else f.removeAttribute('data-bad');
    $$('.field', f).forEach(i => i.setAttribute('aria-invalid', msg ? 'true' : 'false'));
  }
  function validate(step) {
    const bad = [];
    $$('.f', $$('.step')[step]).forEach(f => { const m = problem(f); mark(f, m); if (m) bad.push({ f, m }); });
    return bad;
  }
  function banner(bad) {
    const a = $('#alertBox');
    if (!bad.length) { a.classList.add('hidden'); a.innerHTML = ''; return; }
    a.innerHTML = `<p class="font-bold">${bad.length === 1 ? 'Falta 1 item nesta etapa:' : `Faltam ${bad.length} itens nesta etapa:`}</p>
      <ul class="mt-2 list-disc pl-6">${bad.map((b, i) => `<li><a href="#" data-go="${i}" class="underline underline-offset-4 font-bold text-err">${esc(b.m)}</a></li>`).join('')}</ul>`;
    a.classList.remove('hidden');
    $$('[data-go]', a).forEach(l => l.addEventListener('click', e => { e.preventDefault(); focusField(bad[l.dataset.go].f); }));
  }
  function focusField(f) {
    const t = f.dataset.kind === 'file' ? $('button', f) : $('input', f); if (!t) return;
    f.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'center' });
    t.focus({ preventScroll: true });
  }

  /* ================= EVENTOS DOS CAMPOS ================= */
  document.addEventListener('input', e => {
    const t = e.target, m = mask[t.dataset && t.dataset.type];
    if (m) t.value = m(t.value);
    const f = t.closest('.f'); if (f && f.hasAttribute('data-bad') && !problem(f)) mark(f, '');
  });

  /* ---- arquivos: estado, miniaturas e câmera ---- */
  const DOCS = Object.fromEntries(STEPS.flatMap(s => s.uploads || []).map(x => [x.n, x]));
  const store = Object.fromEntries(Object.keys(DOCS).map(n => [n, []]));
  const urls = {};

  function addFiles(n, list) {
    const arr = [...list]; if (!arr.length) return;
    store[n] = DOCS[n].m ? store[n].concat(arr) : arr.slice(0, 1);
    renderPV(n);
  }
  function renderPV(n) {
    const f = $(`.f[data-name="${n}"]`), box = $('.pv', f);
    (urls[n] || []).forEach(u => URL.revokeObjectURL(u)); urls[n] = [];
    box.innerHTML = '';
    store[n].forEach((file, idx) => {
      const row = document.createElement('div');
      row.className = 'flex items-center gap-3 rounded-lg border border-slate-300 p-2 pr-3';
      let th;
      if (/^(image|video)\//.test(file.type)) {
        const u = URL.createObjectURL(file); urls[n].push(u);
        th = document.createElement(file.type.startsWith('image') ? 'img' : 'video');
        th.src = u; if (th.tagName === 'VIDEO') { th.muted = true; th.preload = 'metadata'; }
        th.className = 'w-14 h-14 rounded-md object-cover shrink-0 bg-rail';
      } else {
        th = document.createElement('span');
        th.className = 'grid place-items-center w-14 h-14 rounded-md bg-rail text-brand shrink-0';
        th.innerHTML = ic('file');
      }
      const info = document.createElement('div');
      info.className = 'min-w-0 flex-1';
      info.innerHTML = `<p class="flex items-center gap-1.5 text-[15px] font-bold text-ok">${ic('check')}Anexado</p><p class="truncate text-[15px] text-muted"></p>`;
      info.lastChild.textContent = file.name;
      const rm = document.createElement('button');
      rm.type = 'button'; rm.textContent = 'Remover';
      rm.className = 'text-[15px] font-bold text-err underline underline-offset-4 px-2 py-2 shrink-0';
      rm.setAttribute('aria-label', `Remover ${file.name}`);
      rm.addEventListener('click', () => { store[n].splice(idx, 1); renderPV(n); });
      row.append(th, info, rm); box.append(row);
    });
    if (!problem(f)) mark(f, ''); else if (f.hasAttribute('data-bad')) { /* mantém o aviso */ }
  }

  const canLiveCam = !matchMedia('(pointer: coarse)').matches && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  let stream = null, camN = null;
  async function openCam(n) {
    camN = n;
    $('#camTitle').textContent = DOCS[n].l;
    $('#camErr').classList.remove('show'); $('#camShot').disabled = true;
    $('#cam').showModal();
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: DOCS[n].face || 'environment', width: { ideal: 1920 } }, audio: false });
      const v = $('#camVideo'); v.srcObject = stream;
      v.style.transform = DOCS[n].face === 'user' ? 'scaleX(-1)' : '';
      $('#camShot').disabled = false;
    } catch (err) {
      const e = $('#camErr');
      e.textContent = 'Não consegui abrir a câmera. Permita o acesso quando o navegador pedir, ou feche e use “Escolher da galeria”.';
      e.classList.add('show');
    }
  }
  function closeCam() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; $('#camVideo').srcObject = null;
    if ($('#cam').open) $('#cam').close();
  }
  $('#camShot').addEventListener('click', () => {
    const v = $('#camVideo'), c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    c.toBlob(b => { addFiles(camN, [new File([b], `foto-${camN}-${Date.now()}.jpg`, { type: 'image/jpeg' })]); closeCam(); }, 'image/jpeg', 0.9);
  });
  $('#camCancel').addEventListener('click', closeCam);
  $('#cam').addEventListener('cancel', e => { e.preventDefault(); closeCam(); });

  $$('[data-pick]').forEach(b => b.addEventListener('click', () => {
    const n = b.dataset.pick, k = b.dataset.mode;
    if (k === 'cam' && canLiveCam) return openCam(n);
    $(`input[data-item="${n}"][data-mode="${k}"]`).click();
  }));
  $$('input[type=file]').forEach(inp => inp.addEventListener('change', () => { addFiles(inp.dataset.item, inp.files); inp.value = ''; }));

  const fav = document.createElement('link'); fav.rel = 'icon'; fav.href = $('#logo').src; document.head.append(fav);

  /* ================= NAVEGAÇÃO ================= */
  let cur = 0;
  const last = STEPS.length - 1;

  function render() {
    $$('.step').forEach((s, i) => s.classList.toggle('on', i === cur));
    $('#rail').innerHTML = `
      <p class="lg:hidden font-bold mb-2">Etapa ${cur + 1} de ${STEPS.length}: <span class="font-normal">${STEPS[cur].title}</span></p>
      <div class="lg:hidden h-2 rounded-full bg-white overflow-hidden" role="progressbar" aria-valuemin="1" aria-valuemax="${STEPS.length}" aria-valuenow="${cur + 1}"><div class="h-full bg-brand rounded-full transition-all duration-200" style="width:${(cur + 1) / STEPS.length * 100}%"></div></div>
      <ol class="hidden lg:block space-y-1">${STEPS.map((s, i) => `
        <li class="flex items-center gap-3 rounded-lg px-3 py-2.5 ${i === cur ? 'bg-white font-bold text-brand' : i < cur ? 'text-ink' : 'text-muted'}" ${i === cur ? 'aria-current="step"' : ''}>
          <span class="grid place-items-center w-7 h-7 rounded-full text-[15px] font-bold shrink-0 ${i < cur ? 'bg-ok text-white' : i === cur ? 'bg-brand text-white' : 'bg-white text-muted'}">${i < cur ? ic('check', '!w-4 !h-4 !stroke-[2.5]').replace('<use href="#i-check"/>', '<path d="m5 12 5 5 9-10"/>') : i + 1}</span>
          <span>${s.title}</span></li>`).join('')}</ol>`;
    $('#back').classList.toggle('invisible', cur === 0);
    $('#next').classList.toggle('hidden', cur === last);
    $('#send').classList.toggle('hidden', cur !== last);
    banner([]);
    scrollTo({ top: 0, behavior: calm ? 'auto' : 'smooth' });
    $(`#t${cur}`).focus({ preventScroll: true });
  }

  $('#next').addEventListener('click', () => {
    const bad = validate(cur);
    if (bad.length) { banner(bad); $('#alertBox').scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'center' }); focusField(bad[0].f); return; }
    cur++; render();
  });
  $('#back').addEventListener('click', () => { if (cur) { cur--; render(); } });

  $('#form').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'radio') { e.preventDefault(); if (cur < last) $('#next').click(); }
  });

  /* ================= ENVIO (simulado) ================= */
  $('#form').addEventListener('submit', e => {
    e.preventDefault();
    const bad = validate(cur);
    if (bad.length) { banner(bad); focusField(bad[0].f); return; }
    const send = $('#send'); send.disabled = true; send.textContent = 'Enviando…';
    // Para enviar de verdade: monte um FormData com os campos e os arquivos de `store` e faça fetch('/sua-api', { method: 'POST', body })
    setTimeout(() => {
      const data = {};
      new FormData(e.target).forEach((v, k) => { data[k] = v; });
      Object.entries(store).forEach(([n, arr]) => { data[n] = arr.map(f => f.name).join(', '); });
      console.log('Cadastro (simulação):', data);
      $('#form').classList.add('hidden'); $('#rail').classList.add('hidden');
      const ok = $('#success'); ok.classList.remove('hidden'); ok.focus({ preventScroll: true });
      scrollTo({ top: 0, behavior: calm ? 'auto' : 'smooth' });
    }, 900);
  });

  render();
})();
</script>
</body>
</html>
